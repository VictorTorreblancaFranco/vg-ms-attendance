server:
  port: ${SERVER_PORT:5085}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

spring:
  application:
    name: vg-ms-attendance
  r2dbc:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 2
      max-size: 10
      max-idle-time: 30m
      max-life-time: 60m
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=1h,maximumSize=100

logging:
  level:
    root: INFO
    com.vg.attendance: DEBUG
    org.springframework.r2dbc: INFO
    io.r2dbc.postgresql: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} - %level - [%thread] - %logger{36} - %msg%n'
  file:
    name: logs/attendance-service.log
    max-size: 10MB
    max-history: 30

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tryItOutEnabled: true
    filter: true

schedule:
  service:
    url: ${SCHEDULE_SERVICE_URL:http://vg-ms-schedule:5083}

enrollment:
  service:
    url: ${ENROLLMENT_SERVICE_URL:http://vg-ms-enrollment:5087}

user:
  service:
    url: ${USER_SERVICE_URL:http://vg-ms-user:5082}

# School information for reports
school:
  name: INSTITUCIÓN EDUCATIVA PÚBLICA MIXTO SAN LUIS
  modular-code: 0286427
  local-code: 354416

# Resilience4j logging
logging.level.io.github.resilience4j: DEBUG
logging.level.io.github.resilience4j.circuitbreaker: DEBUG
logging.level.io.github.resilience4j.retry: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      scheduleService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      enrollmentService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      userService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      scheduleService:
        max-attempts: 3
        wait-duration: 1s
      enrollmentService:
        max-attempts: 3
        wait-duration: 1s
      userService:
        max-attempts: 3
        wait-duration: 1s
