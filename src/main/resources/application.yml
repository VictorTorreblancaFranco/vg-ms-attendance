server:
  port: ${SERVER_PORT:8085}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

spring:
  application:
    name: vg-ms-attendance

  # R2DBC para PostgreSQL Reactivo
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://ep-twilight-rain-aquzch63-pooler.c-8.us-east-1.aws.neon.tech/neondb}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_gevd5bEc4Gai}
    pool:
      initial-size: 2
      max-size: 10
      max-idle-time: 30m
      max-life-time: 60m

  # Flyway necesita URL JDBC (no R2DBC)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: ${FLYWAY_URL:jdbc:postgresql://ep-twilight-rain-aquzch63-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require}
    user: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_gevd5bEc4Gai}

  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=1h,maximumSize=100

# Configuración de servicios externos (mocks por ahora)
academic:
  url: ${ACADEMIC_SERVICE_URL:http://localhost:8080}
  timeout: 5000
  mock:
    enabled: ${ACADEMIC_MOCK_ENABLED:true}

student:
  url: ${STUDENT_SERVICE_URL:http://localhost:8081}
  timeout: 5000
  mock:
    enabled: ${STUDENT_MOCK_ENABLED:true}

logging:
  level:
    root: INFO
    com.vg.attendance: DEBUG
    org.springframework.r2dbc: INFO
    io.r2dbc.postgresql: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} - %level - [%thread] - %logger{36} - %msg%n'
  file:
    name: logs/attendance-service.log
    max-size: 10MB
    max-history: 30

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dummy}
  api-key: ${CLOUDINARY_API_KEY:dummy}
  api-secret: ${CLOUDINARY_API_SECRET:dummy}

resilience4j:
  retry:
    instances:
      academicService:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable
  circuitbreaker:
    instances:
      academicService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true