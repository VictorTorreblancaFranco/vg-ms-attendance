server:
  port: ${SERVER_PORT:5085}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

spring:
  application:
    name: vg-ms-attendance
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://ep-twilight-rain-aquzch63-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_gevd5bEc4Gai}
    pool:
      initial-size: 2
      max-size: 10
      max-idle-time: 30m
      max-life-time: 60m
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: ${FLYWAY_URL:jdbc:postgresql://ep-twilight-rain-aquzch63-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require}
    user: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_gevd5bEc4Gai}
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=1h,maximumSize=100

logging:
  level:
    root: INFO
    com.vg.attendance: DEBUG
    org.springframework.r2dbc: INFO
    io.r2dbc.postgresql: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} - %level - [%thread] - %logger{36} - %msg%n'
  file:
    name: logs/attendance-service.log
    max-size: 10MB
    max-history: 30

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:doz1fu1er}
  api-key: ${CLOUDINARY_API_KEY:295184475961158}
  api-secret: ${CLOUDINARY_API_SECRET:H8HdnkN8NKdhZL-d75T1qIaOpyU}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
